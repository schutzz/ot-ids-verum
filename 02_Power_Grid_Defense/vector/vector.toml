[sources.zeek_dnp3_control_source]
type = "file"
include = ["/usr/local/zeek/logs/current/dnp3_control.log"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000

[transforms.parse_dnp3_control]
type = "remap"
inputs = ["zeek_dnp3_control_source"]
source = '''
  . = parse_json!(.message)

  if exists(.ts) {
    .processing_delay_ms = (to_float(now()) - to_float!(.ts)) * 1000.0
  }

  orig_h = to_string(."id.orig_h") ?? to_string(.id.orig_h) ?? "unknown"
  resp_h = to_string(."id.resp_h") ?? to_string(.id.resp_h) ?? "unknown"

  .zeek_src_ip = orig_h
  .zeek_dest_ip = resp_h
