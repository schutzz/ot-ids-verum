[sources.detection_results_poll]
type = "http_client"
endpoint = "http://elasticsearch:9200/ot-detection-results/_search"
scrape_interval_secs = 15
method = "POST"
headers."Content-Type" = ["application/json"]
body = '''
{
  "query": { "range": { "last_seen": { "gte": "now-2m" } } },
  "size": 200
}
'''

[transforms.parse_detection_poll]
type = "remap"
inputs = ["detection_results_poll"]
source = '''
  parsed = parse_json!(.message)
  hits = array(parsed.hits.hits) ?? []
  . = { "_hits": hits }
'''

[transforms.expand_detection_nodes]
type = "lua"
inputs = ["parse_detection_poll"]
version = "2"
hooks.process = '''
function (event, emit)
    local hits = event.log["_hits"] or {}
    for _, hit in ipairs(hits) do
        local src = hit["_source"]["src_ip"]
        if src ~= nil and src ~= "" and src ~= "unknown" then
            local shadow_mode = os.getenv("SHADOW_MODE")
            if shadow_mode == nil then
                shadow_mode = "true"
            end
            
            local color = "red"
            local shadow_mode_bool = false
            if shadow_mode == "true" then
                color = "blue"
                shadow_mode_bool = true
            end
            
            local top_sig = hit["_source"]["top_signature"]
            local sig_name = "unknown"
            if type(top_sig) == "table" and top_sig["top"] and top_sig["top"][1] and top_sig["top"][1]["metrics"] then
                local metrics = top_sig["top"][1]["metrics"]
                sig_name = metrics["alert_signature.keyword"] or metrics["notice_type.keyword"] or metrics["weird_name.keyword"] or "unknown"
            elseif type(top_sig) == "string" then
                sig_name = top_sig
            end
            
            local new_event = {
                log = {
                    -- id_key="id" として使われ、送信直前にトップレベルからのみ除去される(doc内には影響しない)
                    id = src,
                    doc = {
                        ["@timestamp"] = os.date("!%Y-%m-%dT%H:%M:%SZ"),
                        -- docの中にも複製。これがないと_sourceからidが欠落する(検証済み)
                        id = src,
                        title = src,
                        subTitle = "Correlated Detection (orphan node)",
                        mainStat = "Signature: " .. tostring(sig_name),
                        arc__color = color,
                        detection_score_raw_color = "red",
                        shadow_mode = shadow_mode_bool
                        -- zone_violation は含めない: Signal1(ゾーン逸脱)の情報源はbuild_topology_nodesに一元化する
                    },
                    doc_as_upsert = true
                }
            }
            emit(new_event)
        end
    end
end
'''
