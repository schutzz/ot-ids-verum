[sources.zeek_weird_source]
type = "file"
include = ["/usr/local/zeek/logs/current/weird.log"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000

[transforms.parse_weird]
type = "remap"
inputs = ["zeek_weird_source"]
source = '''
  . = parse_json!(.message)

  if exists(.ts) {
    ."@timestamp" = from_unix_timestamp!(to_int(to_float!(.ts)), "seconds")
  } else {
    ."@timestamp" = now()
  }

  .zeek_src_ip = to_string(."id.orig_h") ?? to_string(.id.orig_h) ?? "unknown"
  .zeek_dest_ip = to_string(."id.resp_h") ?? to_string(.id.resp_h) ?? "unknown"

  .weird_name = to_string(.name) ?? "unknown"
'''

[sinks.elasticsearch_weird]
type = "elasticsearch"
inputs = ["parse_weird"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "ot-logs-weird-%Y.%m.%d"
api_version = "v8"

[sources.suricata_eve_source]
type = "file"
include = ["/suricata-logs/eve.json"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000

[transforms.parse_suricata_eve]
type = "remap"
inputs = ["suricata_eve_source"]
source = '''
  . = parse_json!(.message)

  if .event_type != "alert" {
    abort
  }

  ."@timestamp" = now()
  .zeek_src_ip = to_string(.src_ip) ?? "unknown"
  .zeek_dest_ip = to_string(.dest_ip) ?? "unknown"
  .alert_signature = to_string(.alert.signature) ?? "unknown"
  .alert_sid = to_int(.alert.signature_id) ?? 0
'''

[sinks.elasticsearch_suricata]
type = "elasticsearch"
inputs = ["parse_suricata_eve"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "ot-logs-suricata-%Y.%m.%d"
api_version = "v8"

# Signal6(キルチェーン相関)のIT側イベント用。ot-logs-dnp3-*とは分離した専用index
# (技術的負債#2の教訓: 命名と実態を一致させる)。
[sources.zeek_http_source]
type = "file"
include = ["/usr/local/zeek/logs/current/http.log"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000

[transforms.parse_http]
type = "remap"
inputs = ["zeek_http_source"]
source = '''
  . = parse_json!(.message)

  if exists(.ts) {
    ."@timestamp" = from_unix_timestamp!(to_int(to_float!(.ts)), "seconds")
  } else {
    ."@timestamp" = now()
  }

  .zeek_src_ip = to_string(."id.orig_h") ?? to_string(.id.orig_h) ?? "unknown"
  .zeek_dest_ip = to_string(."id.resp_h") ?? to_string(.id.resp_h) ?? "unknown"
  .http_method = to_string(.method) ?? "unknown"
  .http_uri = to_string(.uri) ?? "unknown"
'''

[sinks.elasticsearch_http]
type = "elasticsearch"
inputs = ["parse_http"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "ot-logs-http-%Y.%m.%d"
api_version = "v8"

[sources.zeek_notice_source]
type = "file"
include = ["/usr/local/zeek/logs/current/notice.log"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000

[transforms.parse_notice]
type = "remap"
inputs = ["zeek_notice_source"]
source = '''
  . = parse_json!(.message)

  if exists(.ts) {
    ."@timestamp" = from_unix_timestamp!(to_int(to_float!(.ts)), "seconds")
  } else {
    ."@timestamp" = now()
  }

  .notice_type = to_string(.note) ?? "unknown"
  .notice_msg = to_string(.msg) ?? ""
  .notice_sub = to_string(.sub) ?? ""
  .zeek_src_ip = to_string(.src) ?? "unknown"
'''

[sinks.elasticsearch_notice]
type = "elasticsearch"
inputs = ["parse_notice"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "ot-logs-notice-%Y.%m.%d"
api_version = "v8"

[sources.detection_results_poll]
type = "http_client"
endpoint = "http://elasticsearch:9200/ot-detection-results/_search"
scrape_interval_secs = 15
method = "POST"
headers."Content-Type" = ["application/json"]
body = '''
{
  "query": { "range": { "last_seen": { "gte": "now-2m" } } },
  "size": 200
}
'''

[transforms.parse_detection_poll]
type = "remap"
inputs = ["detection_results_poll"]
source = '''
  parsed = parse_json!(.message)
  hits = array(parsed.hits.hits) ?? []
  . = { "_hits": hits }
'''

[transforms.expand_detection_nodes]
type = "lua"
inputs = ["parse_detection_poll"]
version = "2"
hooks.process = '''
function (event, emit)
    local hits = event.log["_hits"] or {}
    for _, hit in ipairs(hits) do
        local src = hit["_source"]["src_ip"]
        if src ~= nil and src ~= "" and src ~= "unknown" then
            local shadow_mode = os.getenv("SHADOW_MODE")
            if shadow_mode == nil then
                shadow_mode = "true"
            end
            
            local color = "red"
            local shadow_mode_bool = false
            if shadow_mode == "true" then
                color = "blue"
                shadow_mode_bool = true
            end
            
            local top_sig = hit["_source"]["top_signature"]
            local sig_name = "unknown"
            if type(top_sig) == "table" and top_sig["top"] and top_sig["top"][1] and top_sig["top"][1]["metrics"] then
                local metrics = top_sig["top"][1]["metrics"]
                sig_name = metrics["alert_signature.keyword"] or metrics["notice_type.keyword"] or metrics["weird_name.keyword"] or "unknown"
            elseif type(top_sig) == "string" then
                sig_name = top_sig
            end
            
            local new_event = {
                log = {
                    -- id_key="id" として使われ、送信直前にトップレベルからのみ除去される(doc内には影響しない)
                    id = src,
                    doc = {
                        ["@timestamp"] = os.date("!%Y-%m-%dT%H:%M:%SZ"),
                        -- docの中にも複製。これがないと_sourceからidが欠落する(検証済み)
                        id = src,
                        title = src,
                        subTitle = "Correlated Detection (orphan node)",
                        mainStat = "Signature: " .. tostring(sig_name),
                        -- Phase7-1: arc__color -> color。決定事項#28でcolor単独では
                        -- パネル設定(arcsのハードコード参照)により描画されないと判明したため、
                        -- 公式ドキュメント通りのarc__<name>+arc__<name>_colorペアも併存させる。
                        color = color,
                        arc__status = 1.0,
                        arc__status_color = color,
                        detection_score_raw_color = "red",
                        shadow_mode = shadow_mode_bool
                        -- zone_violation は含めない: Signal1(ゾーン逸脱)の情報源はbuild_topology_nodesに一元化する
                    },
                    doc_as_upsert = true
                }
            }
            emit(new_event)
        end
    end
end
'''

# Signal6(IT→OTキルチェーン相関)のEQLポーリング・ot-logs-killchain-*への書き込みは
# Vectorのhttp_client sourceでは実装しない(決定事項#18: Elasticsearchの_eql/searchエンドポイントと
# 非互換、URL/body/ヘッダーのどの組み合わせでも400が返る一方、_searchや同一内容のcurlは成功することを
# 実機で確認。原因はVector側の未特定の制約と判断し、深追いを断念)。代わりに独立したPython sidecar
# (killchain_eql_poller.py)が同じロジックで直接_bulk書き込みを行う。
