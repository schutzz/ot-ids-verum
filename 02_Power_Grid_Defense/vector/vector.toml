[api]
enabled = true
address = "0.0.0.0:8686"

[sources.zeek_dnp3_source]
type = "file"
include = ["/usr/local/zeek/**/dnp3.log"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000

[sources.zeek_conn_source]
type = "file"
include = ["/usr/local/zeek/**/conn.log"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000



[transforms.parse_dnp3]
type = "remap"
inputs = ["zeek_dnp3_source"]
source = '''
  . = parse_json!(.message)
  
  if exists(.ts) {
    .processing_delay_ms = (to_float(now()) - to_float!(.ts)) * 1000.0
  }

  orig_h = to_string(.id.orig_h) ?? "unknown"
  resp_h = to_string(.id.resp_h) ?? "unknown"

  # --- キー統一修正 (問題①) ---
  # eBPF(loader.c)・攻撃スクリプトは数値FunctionCode(例:"5")でキーを生成する。
  # Zeekネイティブログは文字列 fc_request (例:"DIRECT_OPERATE") しか持たないため、
  # 文字列→数値のマッピングで統一する。
  fc_num = "0"
  if exists(.fc) && .fc != null {
    fc_num = to_string(to_int!(.fc))
  }
  fc_str = to_string(.fc_request) ?? ""
  if fc_num == "0" && fc_str == "DIRECT_OPERATE" { fc_num = "5" }
  if fc_num == "0" && fc_str == "DIRECT_OPERATE_NO_ACK" { fc_num = "6" }
  if fc_num == "0" && fc_str == "IMMED_FREEZE" { fc_num = "7" }
  if fc_num == "0" && fc_str == "FREEZE_CLEAR" { fc_num = "8" }
  if fc_num == "0" && fc_str == "FREEZE_AT_TIME" { fc_num = "9" }
  if fc_num == "0" && fc_str == "COLD_RESTART" { fc_num = "13" }
  if fc_num == "0" && fc_str == "WARM_RESTART" { fc_num = "14" }
  if fc_num == "0" && fc_str == "DISABLE_UNSOLICITED" { fc_num = "20" }
  if fc_num == "0" && fc_str == "ENABLE_UNSOLICITED" { fc_num = "21" }
  if fc_num == "0" && fc_str == "READ" { fc_num = "1" }
  if fc_num == "0" && fc_str == "WRITE" { fc_num = "2" }
  if fc_num == "0" && fc_str == "SELECT" { fc_num = "3" }

  .edge__mainStat = "DNP3 FC: " + fc_num

  orig_h = to_string(.id.orig_h) ?? to_string(."id.orig_h") ?? "unknown"
  orig_p = to_string(.id.orig_p) ?? to_string(."id.orig_p") ?? ""

  .hash_key = orig_h
'''

[transforms.parse_conn]
type = "remap"
inputs = ["zeek_conn_source"]
source = '''
  . = parse_json!(.message)
  
  if exists(.ts) {
    .processing_delay_ms = (to_float(now()) - to_float!(.ts)) * 1000.0
  }

  orig_h = to_string(.id.orig_h) ?? to_string(."id.orig_h") ?? "unknown"
  .hash_key = orig_h
  .edge__mainStat = "SSH/Token Auth"
'''

[transforms.pre_lua_ts]
type = "remap"
inputs = ["parse_dnp3", "parse_conn"]
source = '''
  # VRL now() to Unix Epoch Nanoseconds
  .t_rx_eval = to_unix_timestamp(now(), unit: "nanoseconds")
'''

[transforms.enrich_trace_lua]
type = "lua"
inputs = ["pre_lua_ts"]
version = "2"
hooks.process = '''
function (event, emit)
    -- バグ1修正: event.log.hash_key で正しい階層にアクセス
    local hash_key = event.log.hash_key or ""
    local result = ""

    if hash_key ~= "" then
        -- 修正: 内部DNS名 oob_webdis を使用
        local handle = io.popen('curl -sf --connect-timeout 1.0 -m 1.0 "http://oob_webdis:7379/GET/' .. hash_key .. '" || echo ""')
        result = handle:read("*a")
        handle:close()
    end

    -- バグ2修正: event.log 階層に正しい結果を代入し、デバッグ用文字列を排除
    event.log.webdis_result = result
    emit(event)
end
'''

[transforms.enrich_trace]
type = "remap"
inputs = ["enrich_trace_lua"]
source = '''
result = to_string(.webdis_result) ?? ""
my_span_id = slice!(replace(uuid_v4(), "-", ""), 0, 16)

if exists(.ts) {
    .timestamp = from_unix_timestamp!(to_int(to_float!(.ts)), "seconds")
    ."@timestamp" = .timestamp
} else {
    .timestamp = now()
    ."@timestamp" = .timestamp
}

.enrichment_status = "miss"
.attacker_ip = ""
my_trace_id = replace(uuid_v4(), "-", "")
if exists(.trace_id) && .trace_id != null {
    my_trace_id = to_string!(.trace_id)
}
my_parent_span_id = ""

if result != "" && length(result) > 5 {
    parsed = parse_json(result) ?? {}
    raw = to_string(parsed.GET) ?? ""
    nested = parse_json(raw) ?? {}

    if nested.trace_id != null {
        .enrichment_status = "hit"
        my_trace_id = to_string!(nested.trace_id)
        if nested.parent_span_id != null {
            my_parent_span_id = to_string!(nested.parent_span_id)
        }
        if nested.attacker_ip != null {
            .attacker_ip = to_string!(nested.attacker_ip)
        }
    }
}

log_event = {
    "trace_id": my_trace_id,
    "t_rx_eval": .t_rx_eval,
    "enrichment_status": .enrichment_status,
    "webdis_result": result
}
local_race_log = encode_json(log_event)

raw_zeek_json = encode_json(.)

fc_str = to_string(.fc) ?? to_string(.fc_request) ?? "0x05"

orig_h_str = to_string(.id.orig_h) ?? to_string(."id.orig_h") ?? "unknown"
resp_h_str = to_string(.id.resp_h) ?? to_string(."id.resp_h") ?? "unknown"

tags = {
    "network.src_ip": orig_h_str,
    "network.dest_ip": resp_h_str,
    "network.attacker_ip": .attacker_ip,
    "ot.dnp3.function_code": to_string(.fc) ?? "",
    "enrichment_status": to_string(.enrichment_status),
    "workflow.name": "IT_to_OT_Killchain_DNP3",
    "deployment.environment": "ot-lab",
    "raw_zeek_log": raw_zeek_json,
    "webdis_result": result
}

ts_seconds = to_float(.ts) ?? to_float(to_unix_timestamp(now(), unit: "seconds"))
span_time_micro = to_int(to_unix_timestamp(now(), unit: "microseconds"))

color = "blue"
if .enrichment_status == "hit" {
    color = "red"
}

edge_main_stat = to_string(.edge__mainStat) ?? "Unknown"

. = {
    "@timestamp": .timestamp,
    "traceId": my_trace_id,
    "id": my_span_id,
    "name": "dnp3.direct_operate",
    "kind": "SERVER",
    "timestamp": span_time_micro,
    "duration": 5000,
    "localEndpoint": {
        "serviceName": "OT_DNP3_Substation"
    },
    "tags": tags,
    "race_log": local_race_log,
    "node__id": orig_h_str,
    "edge__id": orig_h_str + "-" + resp_h_str,
    "edge__source": orig_h_str,
    "edge__target": resp_h_str,
    "edge__mainStat": edge_main_stat,
    "color": color,
    "arc__thickness": 3
}

if my_parent_span_id != "" {
    .parentId = my_parent_span_id
}
'''

[transforms.race_log_only]
type = "remap"
inputs = ["enrich_trace"]
source = '''
  . = parse_json!(.race_log)
'''

[sinks.race_condition_file]
type = "file"
inputs = ["race_log_only"]
path = "/usr/local/zeek/logs/vector_eval.log"
encoding = { codec = "json" }


[sinks.splunk_apm]
type = "http"
inputs = ["enrich_trace"]
uri = "https://ingest.jp0.signalfx.com/v2/trace"
auth.strategy = "bearer"
auth.token = "05bdlF4LgTAEMRa2bNB1BQ"
request.headers = { "X-SF-Token" = "05bdlF4LgTAEMRa2bNB1BQ" }
batch.timeout_secs = 0.5
batch.max_events = 10

[sinks.splunk_apm.encoding]
codec = "json"

[sinks.elasticsearch_dnp3]
type = "elasticsearch"
inputs = ["enrich_trace"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "ot-logs-dnp3-%Y.%m.%d"
api_version = "v8"

[transforms.build_topology_nodes]
type = "remap"
inputs = ["enrich_trace"]
source = '''
  src_ip = to_string(.tags."network.src_ip") ?? "unknown"
  if src_ip == "" || src_ip == "unknown" { abort }
  
  if .color == "blue" { abort } # Only emit red nodes to avoid downgrading existing red nodes to blue in ES via upsert. Misses won't overwrite hits. Wait, if we abort, the node is never created if it's always miss.
  
  . = {
    "@timestamp": ."@timestamp",
    "id": src_ip,
    "title": src_ip,
    "subTitle": "Source Node",
    "mainStat": "Active",
    "color": .color
  }
'''

[transforms.build_topology_edges]
type = "remap"
inputs = ["enrich_trace"]
source = '''
  src_ip = to_string(.tags."network.src_ip") ?? "unknown"
  dest_ip = to_string(.tags."network.dest_ip") ?? "unknown"
  if src_ip == "" || src_ip == "unknown" || dest_ip == "" || dest_ip == "unknown" { abort }
  
  edge_id = src_ip + "-" + dest_ip
  
  . = {
    "@timestamp": ."@timestamp",
    "id": edge_id,
    "source": src_ip,
    "target": dest_ip,
    "mainStat": .edge__mainStat,
    "color": .color,
    "arc__thickness": .arc__thickness
  }
'''

[sinks.elasticsearch_topology_nodes]
type = "elasticsearch"
inputs = ["build_topology_nodes"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "ot-topology-nodes-%Y.%m.%d"
id_key = "id"
api_version = "v8"

[sinks.elasticsearch_topology_edges]
type = "elasticsearch"
inputs = ["build_topology_edges"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "ot-topology-edges-%Y.%m.%d"
id_key = "id"
api_version = "v8"


[sinks.elasticsearch_xdp_metrics]
type = "elasticsearch"
inputs = ["parse_xdp_drop", "parse_xdp_pass"]
endpoints = ["http://elasticsearch:9200"]
mode = "bulk"
bulk.index = "xdp-metrics-%Y.%m.%d"
api_version = "v8"



[sinks.debug_console]
type = "console"
inputs = ["enrich_trace"]
target = "stdout"

[sinks.debug_console.encoding]
codec = "json"

[sinks.console]
type = "console"
inputs = ["enrich_trace"]

[sinks.console.encoding]
codec = "json"


[sources.internal_metrics]
type = "internal_metrics"

[sinks.prometheus_exporter]
type = "prometheus_exporter"
inputs = ["internal_metrics"]
address = "0.0.0.0:9090"

[sources.webdis_xdp_drop]
type = "http_client"
endpoint = "http://oob_webdis:7379/GET/xdp_drop_total"
scrape_interval_secs = 5

[sources.webdis_xdp_pass]
type = "http_client"
endpoint = "http://oob_webdis:7379/GET/xdp_pass_total"
scrape_interval_secs = 5

[transforms.parse_xdp_drop]
type = "remap"
inputs = ["webdis_xdp_drop"]
source = '''
  parsed = parse_json(.message) ?? {}
  .xdp_drop_total = to_int(parsed.GET) ?? 0
  .metric_name = "xdp.drop.total"
  ."@timestamp" = now()

'''

[transforms.parse_xdp_pass]
type = "remap"
inputs = ["webdis_xdp_pass"]
source = '''
  parsed = parse_json(.message) ?? {}
  .xdp_pass_total = to_int(parsed.GET) ?? 0
  .metric_name = "xdp.pass.total"
  ."@timestamp" = now()

'''

[sinks.xdp_counter_console]
type = "console"
inputs = ["parse_xdp_drop", "parse_xdp_pass"]
target = "stdout"

[sinks.xdp_counter_console.encoding]
codec = "json"