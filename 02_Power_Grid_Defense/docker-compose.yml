version: '3.8'

networks:
  cc_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24
  wan_link:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
  sub_a_l2_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.20.0/24
  sub_b_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.30.0/24
  mirror_link:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.99.0/24

services:
  # 2026-08-09: docker-compose.ymlのサービス定義から欠落していたことが発覚し復元(オーファン
  # コンテナ化、経緯は計画書参照)。docker inspectで取得した稼働中コンテナの実態(イメージ・
  # ポート・マウント・ネットワークIP・環境変数)を正確に反映。コンテナ自体は2026-08-05作成の
  # ものをそのまま稼働継続させており、本定義追加による再作成は行っていない。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      cc_lan:
        ipv4_address: 10.0.10.40
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      cc_lan:
        ipv4_address: 10.0.10.45
    depends_on:
      - elasticsearch
    restart: unless-stopped

  wan_router:
    image: debian:bullseye-slim
    container_name: wan_router
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      # 決定事項#17の恒久対応: tcミラーリングのロジックはsetup_mirror.sh
      # （WAN/SUB_B/CC_LAN/SUB_A全4インターフェース対応・冪等化済み、決定事項#39）
      # を単一の正とし、ここでの重複実装（WAN/SUB_Bのみ・CC_LAN欠落という
      # バグの温床だった）はやめて、マウントしたスクリプトを直接呼び出す。
      - ./setup_mirror.sh:/setup_mirror.sh:ro
    command: >
      bash -c " apt-get update && apt-get install -y iproute2 iptables tcpdump iputils-ping &&
      bash /setup_mirror.sh &&
      tail -f /dev/null "
    # 決定事項#17追記(2026-08-13): 元々あった`tc qdisc add dev eth0 root netem
    # delay 50ms 10ms loss 1%`は、CC_LANミラーリング欠落の原因究明のための
    # 反証実験用の使い捨てコード（netem遅延注入では症状が改善しないことを
    # 確認する目的、結果は0/8=改善なしで仮説を棄却済み）で、検知パイプライン
    # の設計要素ではなかった。コンテナ再作成のたびにeth0が指すセグメントが
    # シャッフルされる問題（決定事項#17）と組み合わさると、意図しないセグメント
    # に遅延・損失を注入し続ける副作用しかないため削除した。
    networks:
      cc_lan:
        ipv4_address: 10.0.10.254
      wan_link:
        ipv4_address: 172.16.0.254
      sub_a_l2_lan:
        ipv4_address: 10.0.20.254
      sub_b_lan:
        ipv4_address: 10.0.30.254
      mirror_link:
        ipv4_address: 10.0.99.254
    restart: unless-stopped

  jump_server:
    image: debian:bullseye-slim
    container_name: jump_server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - JUMP_SERVER_TOKEN=ukraine_2015_sandworm_token_auth_key
      - ENABLE_OOB=${ENABLE_OOB:-0}
    networks:
      wan_link:
        ipv4_address: 172.16.0.100
    command: >
      bash -c " apt-get update && apt-get install -y iproute2 iptables tcpdump iputils-ping curl && ip route replace 10.0.10.0/24 via 172.16.0.254 && ip route replace 10.0.20.0/24 via 172.16.0.254 && ip route replace 10.0.30.0/24 via 172.16.0.254 && echo 'JumpServer token-authenticated bastion node ready.' && tail -f /dev/null "
    restart: unless-stopped

  external_attacker:
    build: ./external_attacker
    container_name: external_attacker
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./attack_stage2_3_strike.py:/attacks/attack_stage2_3_strike.py
      - ./Phase-ex/external_e2e_pivot_attack.py:/attacks/external_e2e_pivot_attack.py
      - ./Phase-ex:/phase-ex:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      wan_link:
        ipv4_address: 172.16.0.99
      cc_lan:
        ipv4_address: 10.0.10.98
    restart: unless-stopped


  cc_scada_master:
    build: ./cc_scada_master
    container_name: cc_scada_master
    cap_add:
      - NET_ADMIN
    environment:
      - ENABLE_OOB=${ENABLE_OOB:-0}
      - INTEGRITY_POLL_INTERVAL_SEC=300
    volumes:
      - ./Phase-ex:/phase-ex:ro
    networks:
      cc_lan:
        ipv4_address: 10.0.10.10
    restart: unless-stopped

  oob_redis:
    image: redis:7.0-alpine
    container_name: oob_redis
    networks:
      cc_lan:
        ipv4_address: 10.0.10.14
    restart: unless-stopped

  oob_webdis:
    image: nicolas/webdis:0.1.20
    container_name: oob_webdis
    environment:
      - REDIS_HOST=oob_redis
      - REDIS_PORT=6379
    networks:
      cc_lan:
        ipv4_address: 10.0.10.15
    ports:
      - "7379:7379"
    volumes:
      - ./oob_webdis/webdis.prod.json:/etc/webdis.prod.json:ro
    restart: unless-stopped

  sub_a_ied_01:
    image: python:3.10-slim
    container_name: sub_a_ied_01
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./sub_a_ied:/app
    networks:
      sub_a_l2_lan:
        ipv4_address: 10.0.20.10
    command: >
      bash -c " apt-get update && apt-get install -y iproute2 netcat-openbsd && ip route add 10.0.10.0/24 via 10.0.20.254 && ip route add 10.0.30.0/24 via 10.0.20.254 && python -u /app/send_goose.py "
    restart: unless-stopped

  sub_a_ied_02:
    image: python:3.10-slim
    container_name: sub_a_ied_02
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./sub_a_ied:/app
    networks:
      sub_a_l2_lan:
        ipv4_address: 10.0.20.11
    # Phase8-1(決定事項): sub_a_ied_02を「侵害された正規IED」として運用。
    # 既存のtcpdump観測役はバックグラウンドで維持しつつ、
    # sub_a_ied_01のMACを騙るGOOSE poisoning送信をフォアグラウンドで追加。
    command: >
      bash -c " apt-get update && apt-get install -y tcpdump && tcpdump -i eth0 -nn -e ether proto 0x88b8 & python -u /app/send_goose_poison.py "
    restart: unless-stopped

  sub_b_rtu_hmi:
    image: nodered/node-red:3.1.0
    container_name: sub_b_rtu_hmi
    user: root
    cap_add:
      - NET_ADMIN
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      "apk add --no-cache iproute2 netcat-openbsd &&
       ip route add 10.0.10.0/24 via 10.0.30.254 &&
       ip route add 10.0.20.0/24 via 10.0.30.254 &&
       ip route add 172.16.0.0/24 via 10.0.30.254 &&
       python3 /data/target_rtu.py &
       npm install node-red-dashboard &&
       /usr/src/node-red/entrypoint.sh"
    volumes:
      - ./sub_b_hmi:/data
    ports:
      - "1880:1880"
    networks:
      sub_b_lan:
        ipv4_address: 10.0.30.10
    restart: unless-stopped

  sub_b_plc_01:
    # Phase8-2(Modbusサイクル): sub_b_lan(既にsetup_mirror.shのミラーリング対象、
    # 技術的負債#3のような追加ミラーリング作業を回避するための配置選択)に、
    # DNP3のsub_b_rtu_hmiとは別ベンダーのModbus対応PLCという想定で新規追加。
    image: python:3.10-slim
    container_name: sub_b_plc_01
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./sub_b_plc:/app
    networks:
      sub_b_lan:
        ipv4_address: 10.0.30.11
    command: >
      bash -c " pip install --quiet pymodbus==3.6.9 && apt-get update && apt-get install -y iproute2 &&
      ip route add 10.0.10.0/24 via 10.0.30.254 && ip route add 10.0.20.0/24 via 10.0.30.254 &&
      ip route add 172.16.0.0/24 via 10.0.30.254 && python -u /app/modbus_plc_server.py "
    restart: unless-stopped

  zeek_tap:
    image: zeek/zeek:6.0.0
    container_name: zeek_tap
    profiles:
      - legacy
      - ebpf_on
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      mirror_link:
        ipv4_address: 10.0.99.253
    volumes:
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
      - ./zeek/node.cfg:/usr/local/zeek/etc/node.cfg
      - ./zeek/networks.cfg:/usr/local/zeek/etc/networks.cfg
      - zeek_logs:/usr/local/zeek/logs
      - zeek_spool:/usr/local/zeek/spool
    command: >
      bash -c " apt-get update && apt-get install -y linux-headers-generic gcc g++ make cmake libpcap-dev libssl-dev pkg-config iproute2 net-tools && zkg refresh && eval \"$(zkg env)\" && mkdir -p /var/log/zeek && cd /var/log/zeek && zeekctl deploy || true && tail -f /dev/null "
    restart: unless-stopped

  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: otel_collector
    env_file:
      - .env
    networks:
      cc_lan:
        ipv4_address: 10.0.10.30
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - zeek_logs:/var/log/zeek:ro
    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]
    restart: unless-stopped

  vector:
    image: timberio/vector:0.46.0-alpine
    container_name: vector
    command: [ "-c", "/etc/vector/vector.toml" ]
    env_file:
      - .env
    environment:
      - SHADOW_MODE=false
    networks:
      cc_lan:
        ipv4_address: 10.0.10.35
    volumes:
      - ./vector:/etc/vector:ro
      - zeek_logs:/usr/local/zeek/logs
      - zeek_spool:/usr/local/zeek/spool
      - ./suricata/logs:/suricata-logs:ro
    restart: unless-stopped

  es-enrich-refresher:
    # 決定事項#11: Enrich Policy(detection_lookup_policy, last_read_lookup_policy)の
    # 定期_execute化。罠一覧#3(テストのたびに手動_executeが必要)の解消。
    image: curlimages/curl:latest
    container_name: es_enrich_refresher
    entrypoint: >
      sh -c "while true; do
        curl -s -X POST http://elasticsearch:9200/_enrich/policy/detection_lookup_policy/_execute;
        curl -s -X POST http://elasticsearch:9200/_enrich/policy/last_read_lookup_policy/_execute;
        sleep 60;
      done"
    networks:
      - cc_lan
    restart: unless-stopped

  killchain-eql-poller:
    # 決定事項#18: Signal6(キルチェーン相関)のEQL定期ポーリング。Vectorのhttp_client sourceが
    # _eql/searchと非互換と判明したため、Pythonで直接ポーリング→_bulk書き込みを行う。
    image: python:3.11-slim
    container_name: killchain_eql_poller
    volumes:
      - ./killchain_eql_poller.py:/app/killchain_eql_poller.py:ro
    command: sh -c "pip install --quiet requests && python3 /app/killchain_eql_poller.py"
    networks:
      - cc_lan
    restart: unless-stopped

  signal-comparison-reporter:
    # Phase6-2: Redis方式(enrichment_status)と新ロジック(zone_violation/correlation_fresh_hit)の
    # 差分モニタリング。決定事項#22の境界ギリギリでの不一致カテゴリを含む。標準ライブラリのみで
    # 実装しているためpip installは不要(killchain_eql_pollerとの差異)。24時間ごとに直近24時間分を集計。
    image: python:3.11-slim
    container_name: signal_comparison_reporter
    environment:
      - ES_URL=http://elasticsearch:9200
    volumes:
      - ./Phase-ex/signal_comparison_report.py:/app/signal_comparison_report.py:ro
    command: sh -c "while true; do python3 /app/signal_comparison_report.py --hours 24; sleep 86400; done"
    networks:
      - cc_lan
    restart: unless-stopped

  goose-anomaly-sidecar:
    # 決定事項#34: icsnpp-iec61850-gooseのworkerセグフォルトを受け、Zeekのpacket
    # analyzer登録機構には一切触れない設計に変更。es-enrich-refresher/
    # killchain_eql_poller/signal-comparison-reporterに続く4件目のsidecarパターン。
    # mirror_link経由でミラーされたGOOSEフレームを直接観測し、簡易な異常検知
    # (未知MAC・バースト送信)のみを行う。GOOSEの完全なプロトコル解析はしない
    # (Phase9のSpicy自作課題として持ち越し)。
    image: python:3.11-slim
    container_name: goose_anomaly_sidecar
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # 決定事項#45/#46: mirror_linkのみ接続だとelasticsearch(cc_lanのみ接続)に
    # 名前解決できず、ES書き込みが常に失敗し続けていたことが判明。cc_lan追加
    # 接続に伴うip_forwardリスクは、goose-spicy-sidecarと同じくsysctlsで
    # 明示的に無効化する(コンテナ内から/proc/sys直接書き込みは読み取り専用FSで
    # 拒否されるため、Compose側での設定が必須)。
    sysctls:
      - net.ipv4.ip_forward=0
    environment:
      - ES_URL=http://elasticsearch:9200
      - MIRROR_NETWORK_PREFIX=10.0.99.
    volumes:
      - ./goose_anomaly_sidecar.py:/app/goose_anomaly_sidecar.py:ro
    command: sh -c "pip install --quiet scapy && python3 /app/goose_anomaly_sidecar.py"
    networks:
      mirror_link:
        ipv4_address: 10.0.99.20
      cc_lan:
        ipv4_address: 10.0.10.51
    restart: unless-stopped

  goose-spicy-sidecar:
    # 決定事項#44: Zeek統合版(9-3)とstandalone版の非対称性(決定事項#42、
    # 原因未解明のまま)が残ったため、Zeek packet analyzerへの統合を諦め、
    # goose-anomaly-sidecar(決定事項#35)と同種の独立sidecarパターンで、
    # 自作Spicyパーサー(9-3/9-4でstandalone実行=spicy-driverの完全動作を
    # 実証済み)をSignal7として運用する。mirror_link経由でミラーされた
    # GOOSEフレームのペイロードをsubprocessでspicy-driverに渡してパースし、
    # StNum異常ジャンプを判定する。
    image: zeek/zeek:6.0.0
    container_name: goose_spicy_sidecar
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # mirror_link/cc_lan間の意図しないパケット転送を防ぐ防御策。コンテナ内から
    # /proc/sys/net/ipv4/ip_forwardへの直接書き込みは読み取り専用FSで拒否される
    # ため(実機確認済み)、Compose側のsysctls(wan_routerのip_forward=1設定と
    # 対になる、こちらは明示的に0を指定)で確実に無効化する。
    sysctls:
      - net.ipv4.ip_forward=0
    environment:
      - ES_URL=http://elasticsearch:9200
      - MIRROR_NETWORK_PREFIX=10.0.99.
      - HLTO_PATH=/app/goose_sidecar.hlto
    volumes:
      - ./goose_spicy_sidecar.py:/app/goose_spicy_sidecar.py:ro
      - ./goose_spicy_parser/asn1.spicy:/app/asn1.spicy:ro
      - ./goose_spicy_parser/goose_sidecar.spicy:/app/goose_sidecar.spicy:ro
    command: >
      bash -c "
      apt-get update -qq && apt-get install -qq -y gcc g++ make cmake libpcap-dev libssl-dev pkg-config python3 python3-pip >/dev/null 2>&1 &&
      (pip3 install --quiet --break-system-packages scapy 2>/dev/null || pip3 install --quiet scapy) &&
      spicyc -j -o /app/goose_sidecar.hlto /app/asn1.spicy /app/goose_sidecar.spicy &&
      python3 /app/goose_spicy_sidecar.py
      "
    networks:
      mirror_link:
        ipv4_address: 10.0.99.21
      # 決定事項#35(goose-anomaly-sidecar)以来、mirror_linkのみ接続だと
      # elasticsearch(cc_lanのみ接続)への名前解決ができず、ES書き込みが
      # 常に失敗し続けていたことが本セッションで判明(新規負債として記録)。
      # Elasticsearchへの到達性確保のためcc_lanを追加接続する。
      cc_lan:
        ipv4_address: 10.0.10.50
    restart: unless-stopped

  # 技術的負債#6: 以下ebpf_agent/ebpf_tx_agentは正式に退役方針とした(Phase8)。
  # 真因: entrypoint(["/loader","eth0"])がnetwork_mode: host下のホスト自体の
  # プライマリインターフェースを指しており、ラボのOTトラフィック(Dockerブリッジ
  # ネットワーク上)に構造的に到達し得ないため、XDPカウンタは稼働していても
  # 常にDROP=0 PASS=0。Signal1〜6・GOOSE・Modbusいずれの検知もXDPに依存しない。
  # profiles: [ebpf_on]により元々デフォルト起動対象外(このコメント追加以外の
  # 変更は行わない、コード自体は将来の参考のため残す)。
  ebpf_agent:
    build: ./ebpf_agent
    container_name: ebpf_agent
    privileged: false
    network_mode: "host"
    cap_add:
      - BPF
      - NET_ADMIN
      - PERFMON
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    profiles:
      - ebpf_on
    read_only: true
    restart: unless-stopped
    entrypoint: [ "/loader", "eth0" ]

  ebpf_tx_agent:
    build: ./ebpf_tx_agent
    container_name: ebpf_tx_agent
    privileged: true
    pid: "host"
    network_mode: "host"
    environment:
      - ENABLE_OOB=${ENABLE_OOB:-0}
      - WEBDIS_URL=http://${WEBDIS_HOST_IP:-10.0.10.15}:7379
    cap_add:
      - BPF
      - NET_ADMIN
      - PERFMON
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/kernel/btf:/sys/kernel/btf:ro
    profiles:
      - ebpf_on
    restart: unless-stopped

  red-team:
    build: ./red-team
    container_name: red-team
    cap_add:
      - NET_ADMIN
    networks:
      cc_lan:
        ipv4_address: 10.0.10.99
    environment:
      - ENABLE_OOB=${ENABLE_OOB:-0}
      - WEBDIS_URL=http://oob_webdis:7379
    volumes:
      - ./attack_stage2_3_strike.py:/attacks/attack_stage2_3_strike.py
      - ./stealth_combo_attack.py:/attacks/stealth_combo_attack.py
      - ./microburst_attack.py:/attacks/microburst_attack.py
      - ./microburst_attack_v3.py:/attacks/microburst_attack_v3.py
      - ./modbus_write_coil_attack.py:/attacks/modbus_write_coil_attack.py
      - ./flood_test_dnp3.py:/attacks/flood_test_dnp3.py
      - ./flood_test_dnp3_udp.py:/attacks/flood_test_dnp3_udp.py
      - ./Phase-ex/dnp3_frame.py:/attacks/Phase-ex/dnp3_frame.py
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "ip route add 10.0.20.0/24 via 10.0.10.254 && ip route add 10.0.30.0/24 via 10.0.10.254 && tail -f /dev/null"
    restart: unless-stopped




  suricata_ids:
    image: jasonish/suricata:latest
    container_name: suricata_ids
    networks:
      - mirror_link
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./suricata/rules:/etc/suricata/rules
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./suricata/logs:/var/log/suricata
    command: -i eth0 --af-packet -c /etc/suricata/suricata.yaml
    restart: unless-stopped
volumes:
  zeek_logs:
  zeek_spool:
