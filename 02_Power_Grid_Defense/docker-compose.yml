version: '3.8'

networks:
  cc_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24
  wan_link:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
  sub_a_l2_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.20.0/24
  sub_b_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.30.0/24
  mirror_link:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.99.0/24

services:
  wan_router:
    image: debian:bullseye-slim
    container_name: wan_router
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    command: >
      bash -c " apt-get update && apt-get install -y iproute2 iptables tcpdump iputils-ping &&
      tc qdisc add dev eth0 root netem delay 50ms 10ms loss 1% &&
      MIRROR_IF=$$(ip -o addr show | grep '10.0.99.254' | awk '{print $$2}') &&
      WAN_IF=$$(ip -o addr show | grep '172.16.0.254' | awk '{print $$2}') &&
      SUB_B_IF=$$(ip -o addr show | grep '10.0.30.254' | awk '{print $$2}') &&
      tc qdisc add dev $$WAN_IF handle ffff: ingress &&
      tc filter add dev $$WAN_IF parent ffff: protocol all u32 match u32 0 0 action mirred egress mirror dev $$MIRROR_IF &&
      tc qdisc add dev $$SUB_B_IF handle ffff: ingress &&
      tc filter add dev $$SUB_B_IF parent ffff: protocol all u32 match u32 0 0 action mirred egress mirror dev $$MIRROR_IF &&
      tail -f /dev/null "
    networks:
      cc_lan:
        ipv4_address: 10.0.10.254
      wan_link:
        ipv4_address: 172.16.0.254
      sub_a_l2_lan:
        ipv4_address: 10.0.20.254
      sub_b_lan:
        ipv4_address: 10.0.30.254
      mirror_link:
        ipv4_address: 10.0.99.254
    restart: unless-stopped

  jump_server:
    image: debian:bullseye-slim
    container_name: jump_server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - JUMP_SERVER_TOKEN=ukraine_2015_sandworm_token_auth_key
      - ENABLE_OOB=${ENABLE_OOB:-0}
    networks:
      wan_link:
        ipv4_address: 172.16.0.100
    command: >
      bash -c " apt-get update && apt-get install -y iproute2 iptables tcpdump iputils-ping curl && ip route add 10.0.10.0/24 via 172.16.0.254 && ip route add 10.0.20.0/24 via 172.16.0.254 && ip route add 10.0.30.0/24 via 172.16.0.254 && echo 'JumpServer token-authenticated bastion node ready.' && tail -f /dev/null "
    restart: unless-stopped

  external_attacker:
    image: debian:bullseye-slim
    container_name: external_attacker
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./attack_stage2_3_strike.py:/attacks/attack_stage2_3_strike.py
      - ./external_e2e_pivot_attack.py:/attacks/external_e2e_pivot_attack.py
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      wan_link:
        ipv4_address: 172.16.0.99
      cc_lan:
        ipv4_address: 10.0.10.98
    command: >
      bash -c " export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y iproute2 iptables tcpdump iputils-ping curl python3 && curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-20.10.9.tgz | tar xzvf - --strip-components=1 -C /usr/local/bin docker/docker && ip route add 10.0.10.0/24 via 172.16.0.254 && ip route add 10.0.20.0/24 via 172.16.0.254 && ip route add 10.0.30.0/24 via 172.16.0.254 && echo 'External Attacker node ready.' && tail -f /dev/null "
    restart: unless-stopped


  cc_scada_master:
    build: ./cc_scada_master
    container_name: cc_scada_master
    cap_add:
      - NET_ADMIN
    environment:
      - ENABLE_OOB=${ENABLE_OOB:-0}
    networks:
      cc_lan:
        ipv4_address: 10.0.10.10
    restart: unless-stopped

  oob_redis:
    image: redis:7.0-alpine
    container_name: oob_redis
    networks:
      cc_lan:
        ipv4_address: 10.0.10.14
    restart: unless-stopped

  oob_webdis:
    image: nicolas/webdis:0.1.20
    container_name: oob_webdis
    environment:
      - REDIS_HOST=oob_redis
      - REDIS_PORT=6379
    networks:
      cc_lan:
        ipv4_address: 10.0.10.15
    ports:
      - "7379:7379"
    volumes:
      - ./oob_webdis/webdis.prod.json:/etc/webdis.prod.json:ro
    restart: unless-stopped

  sub_a_ied_01:
    image: python:3.10-slim
    container_name: sub_a_ied_01
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./sub_a_ied:/app
    networks:
      sub_a_l2_lan:
        ipv4_address: 10.0.20.10
    command: >
      bash -c " apt-get update && apt-get install -y iproute2 netcat-openbsd && ip route add 10.0.10.0/24 via 10.0.20.254 && ip route add 10.0.30.0/24 via 10.0.20.254 && python -u /app/send_goose.py "
    restart: unless-stopped

  sub_a_ied_02:
    image: python:3.10-slim
    container_name: sub_a_ied_02
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      sub_a_l2_lan:
        ipv4_address: 10.0.20.11
    command: >
      bash -c " apt-get update && apt-get install -y tcpdump && tcpdump -i eth0 -nn -e ether proto 0x88b8 "
    restart: unless-stopped

  sub_b_rtu_hmi:
    image: nodered/node-red:3.1.0
    container_name: sub_b_rtu_hmi
    user: root
    cap_add:
      - NET_ADMIN
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      "apk add --no-cache iproute2 netcat-openbsd &&
       ip route add 10.0.10.0/24 via 10.0.30.254 &&
       ip route add 10.0.20.0/24 via 10.0.30.254 &&
       ip route add 172.16.0.0/24 via 10.0.30.254 &&
       python3 /data/target_rtu.py &
       npm install node-red-dashboard &&
       /usr/src/node-red/entrypoint.sh"
    volumes:
      - ./sub_b_hmi:/data
    ports:
      - "1880:1880"
    networks:
      sub_b_lan:
        ipv4_address: 10.0.30.10
    restart: unless-stopped

  zeek_tap:
    image: zeek/zeek:6.0.0
    container_name: zeek_tap
    profiles:
      - legacy
      - ebpf_on
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      mirror_link:
        ipv4_address: 10.0.99.20
    volumes:
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
      - ./zeek/node.cfg:/usr/local/zeek/etc/node.cfg
      - ./zeek/networks.cfg:/usr/local/zeek/etc/networks.cfg
      - zeek_logs:/usr/local/zeek/logs
      - zeek_spool:/usr/local/zeek/spool
    command: >
      bash -c " apt-get update && apt-get install -y linux-headers-generic gcc g++ make cmake libpcap-dev libssl-dev pkg-config iproute2 net-tools && zkg refresh && eval \"$(zkg env)\" && mkdir -p /var/log/zeek && cd /var/log/zeek && zeekctl deploy || true && tail -f /dev/null "
    restart: unless-stopped

  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: otel_collector
    env_file:
      - .env
    networks:
      cc_lan:
        ipv4_address: 10.0.10.30
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - zeek_logs:/var/log/zeek:ro
    command: [ "--config=/etc/otelcol-contrib/config.yaml" ]
    restart: unless-stopped

  vector:
    image: timberio/vector:0.35.0-alpine
    container_name: vector
    command: [ "-c", "/etc/vector/vector.toml" ]
    env_file:
      - .env
    networks:
      cc_lan:
        ipv4_address: 10.0.10.35
    volumes:
      - ./vector:/etc/vector:ro
      - zeek_logs:/usr/local/zeek/logs
      - zeek_spool:/usr/local/zeek/spool
    restart: unless-stopped

  ebpf_agent:
    build: ./ebpf_agent
    container_name: ebpf_agent
    privileged: false
    network_mode: "host"
    cap_add:
      - BPF
      - NET_ADMIN
      - PERFMON
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    profiles:
      - ebpf_on
    read_only: true
    restart: unless-stopped
    entrypoint: [ "/loader", "eth0" ]

  ebpf_tx_agent:
    build: ./ebpf_tx_agent
    container_name: ebpf_tx_agent
    privileged: true
    pid: "host"
    network_mode: "host"
    environment:
      - ENABLE_OOB=${ENABLE_OOB:-0}
      - WEBDIS_URL=http://${WEBDIS_HOST_IP:-10.0.10.15}:7379
    cap_add:
      - BPF
      - NET_ADMIN
      - PERFMON
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/kernel/btf:/sys/kernel/btf:ro
    profiles:
      - ebpf_on
    restart: unless-stopped

  red-team:
    build: ./red-team
    container_name: red-team
    cap_add:
      - NET_ADMIN
    networks:
      cc_lan:
        ipv4_address: 10.0.10.99
    environment:
      - ENABLE_OOB=${ENABLE_OOB:-0}
      - WEBDIS_URL=http://oob_webdis:7379
    volumes:
      - ./attack_stage2_3_strike.py:/attacks/attack_stage2_3_strike.py
      - ./stealth_combo_attack.py:/attacks/stealth_combo_attack.py
      - ./microburst_attack.py:/attacks/microburst_attack.py
      - ./microburst_attack_v3.py:/attacks/microburst_attack_v3.py
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "ip route add 10.0.20.0/24 via 10.0.10.254 && ip route add 10.0.30.0/24 via 10.0.10.254 && tail -f /dev/null"
    restart: unless-stopped




  vector_forwarder:
    image: timberio/vector:0.35.0-debian
    container_name: vector_forwarder
    user: root
    environment:
      - ENABLE_OOB=${ENABLE_OOB:-0}
      - WEBDIS_URL=http://oob_webdis:7379
      - ELASTIC_URL=http://elasticsearch:9200
      - SPLUNK_URL=https://ingest.us1.signalfx.com/v2/trace
      - SPLUNK_TOKEN=r4y4-G5Zg_n8rK7Bpxk8iA
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - zeek_logs:/usr/local/zeek/logs:ro
      - zeek_spool:/usr/local/zeek/spool:ro
    networks:
      cc_lan:
        ipv4_address: 10.0.10.20
    restart: unless-stopped

volumes:
  zeek_logs:
  zeek_spool:


