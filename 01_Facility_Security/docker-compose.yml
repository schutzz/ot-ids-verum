version: '3.8'

# ==========================================
# 1. 論理ネットワークの定義 (L2分離基盤)
# ==========================================
networks:
  ot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24  # OT_Network: 物理機器シミュレータ用

  it_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24  # IT_Network: 攻撃者端末・ログ収集基盤用

# ==========================================
# 2. サービス(コンテナ)の定義
# ==========================================
services:
  # 統合監視盤 (HMI) - Node-RED
  hmi-nodered:
    image: nodered/node-red:latest
    container_name: hmi-nodered
    ports:
      - "1880:1880" # ホスト(先輩のPC)の1880番ポートをコンテナの1880番に直結
    volumes:
      - ./hmi_data:/data
    networks:
      ot_net:
        ipv4_address: 192.168.100.10 # OT網内でIPアドレスを固定
    restart: unless-stopped

  # OT 仮想センサーエミュレータ (Rust)
  sensor-emulator:
    build:
      context: ./sensor-emulator
      dockerfile: Dockerfile
    container_name: sensor-emulator
    ports:
      - "502:502"
    networks:
      ot_net:
        ipv4_address: 192.168.100.11 # OT網内でIP固定 (192.168.100.11)
    restart: unless-stopped
